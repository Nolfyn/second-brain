[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "second-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "msoffcrypto-tool>=5.4.0",
    "pdfminer.six>=20221105",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pdf2image>=1.17.0",
    "nltk>=3.8.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.2.0",
    "duckduckgo-search>=6.0.0",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "unstructured>=0.14.0",
    "ebooklib>=0.18",
    "html2text>=2024.2.26",
    "python-pptx>=0.6.23",
    "chardet>=5.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
brain = "brain.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]